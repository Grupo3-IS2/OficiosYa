version: 2
updates:
  # 1. Frontend (React / npm)
  - package-ecosystem: "npm"
    directory: "/frontend" # Cambia por la carpeta donde está tu package.json (o "/" si está en la raíz)
    schedule:
      interval: "weekly"
    target-branch: "dev"

  # 2. Backend (Java Spring / Maven)
  # Nota: si usas Gradle en lugar de Maven, cambia "maven" por "gradle"
  - package-ecosystem: "maven"
    directory: "/" # El pom.xml del backend está en la raíz del repositorio.
    schedule:
      interval: "daily"
    target-branch: "dev"
    groups:
      # jjwt-api/impl/jackson deben ir siempre en la misma versión.
      jjwt:
        patterns: ["io.jsonwebtoken:*"]

  # 3. Docker (imagen base del Dockerfile)
  - package-ecosystem: "docker"
    directory: "/" # El Dockerfile está en la raíz del repositorio.
    schedule:
      interval: "weekly"
    target-branch: "dev"
