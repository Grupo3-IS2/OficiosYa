# OficiosYa - dev (dev branch, ~/dev on the server)
#
# Same shape as the production vhost: the host's nginx serves the React build
# from the clone's frontend/dist and reverse-proxies /api and /ws to the Spring
# Boot container, published on 127.0.0.1:8081. The build is refreshed by the
# Deploy workflow.

upstream oficiosya_dev {
    server 127.0.0.1:8081;   # APP_PORT of ~/dev
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dev.oficiosya.duckdns.org www.dev.oficiosya.duckdns.org;
    return 301 https://dev.oficiosya.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.oficiosya.duckdns.org www.dev.oficiosya.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dev.oficiosya.duckdns.org/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.oficiosya.duckdns.org/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                         # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                               # managed by Certbot

    access_log /var/log/nginx/oficiosya-dev-access.log;
    error_log  /var/log/nginx/oficiosya-dev-error.log;

    client_max_body_size 20M;

    # React build inside the clone (frontend/dist is gitignored, so
    # `git reset --hard` in the deploy never touches it).
    root /home/oficios-ya/storage/oficios-ya/dev/frontend/dist;
    index index.html;

    # Long-lived cache for the hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> Spring Boot
    location /api/ {
        proxy_pass http://oficiosya_dev;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket (STOMP) -> Spring Boot
    location /ws/ {
        proxy_pass http://oficiosya_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Management endpoints are never exposed through the public entrypoint.
    location /actuator/ {
        return 404;
    }

    # SPA: static file if it exists, otherwise index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
