# OficiosYa - dev branch

# Per client IP on /api/: 10 requests/s, bursts of 30 (a page load fires several at once).
# The zone name must differ between the two vhosts, both are loaded in the same http {}.
limit_req_zone $binary_remote_addr zone=oficiosya_dev_api:10m rate=10r/s;

upstream oficiosya_dev {
    server 127.0.0.1:8081;   # APP_PORT of ~/dev
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name dev.oficiosya.duckdns.org www.dev.oficiosya.duckdns.org;
    return 301 https://dev.oficiosya.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.oficiosya.duckdns.org www.dev.oficiosya.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dev.oficiosya.duckdns.org/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.oficiosya.duckdns.org/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                         # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                               # managed by Certbot

    access_log /var/log/nginx/oficiosya-dev-access.log;
    error_log  /var/log/nginx/oficiosya-dev-error.log;

    set $oficiosya_dir     /home/oficios-ya/storage/oficios-ya/dev;
    set $oficiosya_backend oficiosya_dev;
    include /home/oficios-ya/storage/oficios-ya/dev/nginx/oficiosya-site.conf;

    # REST API -> Spring Boot
    location /api/ {
        limit_req zone=oficiosya_dev_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://oficiosya_dev;
    }

    # OpenAPI spec + Swagger UI -> Spring Boot. Dev only: the production vhost
    # does not expose these. springdoc honours X-Forwarded-* so the generated
    # URLs come out as https://dev.oficiosya.duckdns.org/...
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://oficiosya_dev;
    }

    # Mailpit, the inbox where the app's emails land (the registration codes): web
    # UI and its API, at https://dev.oficiosya.duckdns.org/mailpit/.
    # Needs MAILPIT_WEBROOT=mailpit in the dev clone's .env.
    location = /mailpit {
        return 301 /mailpit/;
    }

    location /mailpit/ {
        proxy_pass http://127.0.0.1:8025;

        # The inbox updates live over a WebSocket (/mailpit/api/events).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # $http_host, not $host: Mailpit compares the browser's Origin with the Host it
        # receives before accepting the WebSocket, and $host drops a non-default port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
