# OFICIOS YA MAIN

upstream spring_backend_prod {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    if ($host = oficiosya.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name oficiosya.duckdns.org www.oficiosya.duckdns.org;

    access_log /var/log/nginx/mi-app-access.log;
    error_log  /var/log/nginx/mi-app-error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://spring_backend_prod;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://spring_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /actuator/ {
        proxy_pass http://spring_backend_prod;
        allow 127.0.0.1;
        deny all;
    }



}

server {
    listen 443 ssl http2;
    server_name oficiosya.duckdns.org;

    location / {
        proxy_pass http://spring_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    ssl_certificate /etc/letsencrypt/live/oficiosya.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oficiosya.duckdns.org/privkey.pem; # managed by Certbot
}

server {
    listen 80;
    server_name oficiosya.duckdns.org;
    return 301 https://$host$request_uri;
}
