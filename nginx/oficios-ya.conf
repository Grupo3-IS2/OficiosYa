# OficiosYa - production (main branch, ~/release on the server)
#
# The host's nginx serves the React build straight from disk and reverse-proxies

upstream oficiosya_prod {
    server 127.0.0.1:8080;   # APP_PORT of ~/release
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oficiosya.duckdns.org www.oficiosya.duckdns.org;
    return 301 https://oficiosya.duckdns.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oficiosya.duckdns.org www.oficiosya.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/oficiosya.duckdns.org/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oficiosya.duckdns.org/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                     # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                           # managed by Certbot

    access_log /var/log/nginx/oficiosya-access.log;
    error_log  /var/log/nginx/oficiosya-error.log;

    client_max_body_size 20M;

    # React build uploaded by the Deploy workflow.
    root /var/www/oficiosya/release;
    index index.html;

    # Long-lived cache for the hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> Spring Boot
    location /api/ {
        proxy_pass http://oficiosya_prod;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket (STOMP) -> Spring Boot
    location /ws/ {
        proxy_pass http://oficiosya_prod;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Management endpoints are never exposed through the public entrypoint.
    location /actuator/ {
        return 404;
    }

    # SPA: static file if it exists, otherwise index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
