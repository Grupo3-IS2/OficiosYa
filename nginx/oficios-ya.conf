# OficiosYa - main branch

# Per client IP on /api/: 10 requests/s, bursts of 30 (a page load fires several at once).
# The zone name must differ between the two vhosts, both are loaded in the same http {}.
limit_req_zone $binary_remote_addr zone=oficiosya_api:10m rate=10r/s;

upstream oficiosya_prod {
    server 127.0.0.1:8080;   # APP_PORT of ~/release
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name oficiosya.duckdns.org www.oficiosya.duckdns.org;
    return 301 https://oficiosya.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oficiosya.duckdns.org www.oficiosya.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/oficiosya.duckdns.org/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oficiosya.duckdns.org/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                     # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                           # managed by Certbot

    access_log /var/log/nginx/oficiosya-access.log;
    error_log  /var/log/nginx/oficiosya-error.log;

    set $oficiosya_dir     /home/oficios-ya/storage/oficios-ya/release;
    set $oficiosya_backend oficiosya_prod;
    include /home/oficios-ya/storage/oficios-ya/release/nginx/oficiosya-site.conf;

    # REST API -> Spring Boot.
    location /api/ {
        limit_req zone=oficiosya_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://oficiosya_prod;
    }
}
