# OficiosYa - what production and dev share

server_tokens off;
client_max_body_size 20M;

# --- Response headers ---------------------------------------------------------------
# Every add_header lives here, at server level

# HTTPS only
add_header Strict-Transport-Security "max-age=31536000" always;

# With this no other site can frame the site (clickjacking)
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;

# Other sites get only the origin, never the full URL
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# "public, immutable" in the locations whose files never change under the same name.
set $oficiosya_cache_control "";
add_header Cache-Control $oficiosya_cache_control;

# --- Proxy to Spring Boot -----------------------------------------------------------
# Shared by every proxied location.
proxy_http_version 1.1;
set $oficiosya_connection "";
proxy_set_header Connection        $oficiosya_connection;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;

# --- Locations ----------------------------------------------------------------------

# React build inside the clone (frontend/dist is gitignored, so
# `git reset --hard` in the deploy never touches it).
root $oficiosya_dir/frontend/dist;
index index.html;

# Hidden files (.env, .git/, ...) are never served, not even as the SPA fallback:
# scanners probing for them get a 404 instead of a 200. .well-known/ stays for certbot.
location ~ /\.(?!well-known/) {
    return 404;
}

# Long-lived cache for the hashed build assets.
location /assets/ {
    expires 1y;
    set $oficiosya_cache_control "public, immutable";
    try_files $uri =404;
}

# Profile images uploaded through the API, straight from the clone's uploads/
location /uploads/ {
    root $oficiosya_dir;
    expires 30d;
    set $oficiosya_cache_control "public, immutable";
}

# WebSocket (STOMP) -> Spring Boot
location /ws/ {
    set $oficiosya_connection "upgrade";
    proxy_pass http://$oficiosya_backend;
    proxy_read_timeout 3600s;
}

# Management endpoints are never exposed through the public entrypoint.
location /actuator/ {
    return 404;
}

# The entry point must never be reused
location = /index.html {
    expires -1;
}

# SPA: static file if it exists, otherwise index.html (client-side routing).
location / {
    try_files $uri $uri/ /index.html;
}
