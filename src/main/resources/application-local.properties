# Local profile: embedded H2 database, no external server needed.
# The data is stored in ./data/<DB_NAME>.mv.db, so it survives restarts.
spring.datasource.url=jdbc:h2:file:./data/${DB_NAME:backend};AUTO_SERVER=TRUE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Web console: http://localhost:8080/h2-console (JDBC URL = the one above)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
