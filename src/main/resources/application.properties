# Load environment variables (.env is optional: every property below has a local default)
spring.config.import=optional:file:.env[.properties]

# Active profile: "local" (embedded H2, no external server) or "postgres"
spring.profiles.active=${APP_PROFILE:local}

spring.application.name=oficiosya

server.port=${SERVER_PORT:8080}

# JPA/Hibernate Configuration (datasource lives in application-<profile>.properties)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Print SQL
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Web: host without scheme, used by SecurityConfig to build the CORS allowed origins
app.web-url=${WEB_URL:localhost}

# Auth
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:private_jwt.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:public_jwt.pem}
