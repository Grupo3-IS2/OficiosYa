# Load environment variables (.env is optional: every property below has a default)
spring.config.import=optional:file:.env[.properties]

spring.application.name=oficiosya

server.port=${SERVER_PORT:8080}

# Behind nginx (TLS terminated at the proxy): trust X-Forwarded-* so the app
# sees the original scheme/host when building URLs and redirects.
server.forward-headers-strategy=framework

# --- Datasource: PostgreSQL (the "db" service in docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:oficiosya}
spring.datasource.username=${DB_USERNAME:oficiosya}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Web: host without scheme, used by SecurityConfig to build the CORS allowed origins
app.web-url=${WEB_URL:localhost}

# Uploads (profile images). Docker mounts the clone's ./uploads at /app/uploads.
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Read an oversized body up to nginx's client_max_body_size, so the client gets
# the 413 JSON instead of a reset connection.
server.tomcat.max-swallow-size=20MB

# OpenAPI / Swagger UI (set SWAGGER_ENABLED=false to disable in production)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Auth
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:private_jwt.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:public_jwt.pem}

# Default administrator, created on startup if it doesn't exist yet. Left unset,
# ADMIN_PASSWORD is blank and no admin is created at all (see AdminSeeder).
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@oficiosya.com}
app.admin.password=${ADMIN_PASSWORD:}

# Mail (used to send verification codes). In local/dev point these at a throwaway SMTP
# server such as Mailhog or Ethereal; SMTP_AUTH/SMTP_STARTTLS need to be true for real providers.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Addresses with non-ASCII characters (ñandú@...) need the SMTPUTF8 extension; a server that lacks it
# refuses them and the send fails with a 503 like any other delivery failure.
spring.mail.properties.mail.mime.allowutf8=true
app.mail.from=${MAIL_FROM:no-reply@oficiosya.com}

# Google sign-in: the OAuth Client ID (not a secret) the browser's Google button is set up with.
# Left empty, sign-in with Google is disabled and everything else keeps working.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Email verification codes (account activation and email change)
app.verification.code-length=${VERIFICATION_CODE_LENGTH:6}
app.verification.expiration-minutes=${VERIFICATION_EXPIRATION_MINUTES:15}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
# Pepper mixed into every code's hash; set VERIFICATION_SECRET in production.
app.verification.secret=${VERIFICATION_SECRET:change-me-in-prod}

# Per client (IP) cap on the endpoints that mail or check a verification code, so they can't
# be used to flood arbitrary addresses with emails.
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
