# Load environment variables (.env is optional: every property below has a default)
spring.config.import=optional:file:.env[.properties]

spring.application.name=oficiosya

server.port=${SERVER_PORT:8080}

# Behind nginx (TLS terminated at the proxy): trust X-Forwarded-* so the app
# sees the original scheme/host when building URLs and redirects.
server.forward-headers-strategy=framework

# --- Datasource: PostgreSQL (the "db" service in docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:oficiosya}
spring.datasource.username=${DB_USERNAME:oficiosya}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Loads lazy collections (a job's tasks and schedules) for many entities at once instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=32
# Lets ddl-auto create the "chat" schema the chat tables live in (see Conversation, ChatMessage).
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Web: host without scheme, used by SecurityConfig to build the CORS allowed origins
app.web-url=${WEB_URL:localhost}

# Uploads (profile images). Docker mounts the clone's ./uploads at /app/uploads.
app.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Read an oversized body up to nginx's client_max_body_size, so the client gets
# the 413 JSON instead of a reset connection.
server.tomcat.max-swallow-size=20MB

# OpenAPI / Swagger UI (set SWAGGER_ENABLED=false to disable in production)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Auth
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
# How long a login lasts without being used: each renewal of the access token starts it over.
security.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
# Off only to serve over plain http on a host other than localhost; browsers drop Secure cookies there.
security.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:true}
security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:private_jwt.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:public_jwt.pem}

# Default administrator, created on startup if it doesn't exist yet. Left unset,
# ADMIN_PASSWORD is blank and no admin is created at all (see AdminSeeder).
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@oficiosya.com}
app.admin.password=${ADMIN_PASSWORD:}

# Mail (used to send verification codes). In local/dev point these at a throwaway SMTP
# server such as Mailhog or Ethereal; SMTP_AUTH/SMTP_STARTTLS need to be true for real providers.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
# Addresses with non-ASCII characters (ñandú@...) need the SMTPUTF8 extension; a server that lacks it
# refuses them and the send fails with a 503 like any other delivery failure.
spring.mail.properties.mail.mime.allowutf8=true
app.mail.from=${MAIL_FROM:no-reply@oficiosya.com}
# Emails about requests (a change of timeframe asked of the user, requests piling up), for users who keep them on.
# The site's address, for the link in them; and how many things waiting for an answer trigger the "waiting for you" one.
app.notifications.site-url=${APP_PUBLIC_URL:http://localhost:5173}
app.notifications.awaiting-answer-threshold=${NOTIFY_AWAITING_ANSWER_THRESHOLD:3}

# Google sign-in: the OAuth Client ID (not a secret) the browser's Google button is set up with.
# Left empty, sign-in with Google is disabled and everything else keeps working.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Email verification codes (account activation and email change)
# false skips them: registering creates the account and an email change applies right away.
app.verification.enabled=${VERIFICATION_ENABLED:true}
app.verification.code-length=${VERIFICATION_CODE_LENGTH:6}
app.verification.expiration-minutes=${VERIFICATION_EXPIRATION_MINUTES:15}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.resend-cooldown-seconds=${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
# Pepper mixed into every code's hash; set VERIFICATION_SECRET in production.
app.verification.secret=${VERIFICATION_SECRET:change-me-in-prod}

# Per client (IP) cap on the endpoints that mail or check a verification code, so they can't
# be used to flood arbitrary addresses with emails.
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
# Per user caps on the chat: messages sent per minute, and conversations created per day (reopening
# an existing one doesn't count).
app.rate-limit.chat-messages-per-minute=${RATE_LIMIT_CHAT_PER_MINUTE:30}
app.rate-limit.chat-new-conversations-per-day=${RATE_LIMIT_CHAT_NEW_CONVERSATIONS_PER_DAY:20}

# Job requests: an accepted job can't be cancelled or rescheduled with less notice than this.
app.job-request.min-notice-hours=${JOB_MIN_NOTICE_HOURS:24}
# Hours an unanswered proposal lasts before it becomes EXPIRED (-1: only once its proposed timeframe goes by).
app.job-request.proposal-expiration-hours=${JOB_PROPOSAL_EXPIRATION_HOURS:72}

# Chat. The key encrypts the messages at rest: 32 bytes in Base64 (`openssl rand -base64 32`). It has
# no default and the app doesn't start without it; losing it makes the stored messages unreadable.
app.chat.encryption-key=${CHAT_ENCRYPTION_KEY:}
app.chat.message-max-length=${CHAT_MESSAGE_MAX_LENGTH:2000}
# At most one "unread messages" email per conversation and side every this many hours.
app.chat.unread-mail-interval-hours=${CHAT_UNREAD_MAIL_INTERVAL_HOURS:4}
# Days a message is kept (-1: forever).
app.chat.message-retention-days=${CHAT_MESSAGE_RETENTION_DAYS:-1}
