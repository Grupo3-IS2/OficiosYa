# Load environment variables (.env is optional: every property below has a default)
spring.config.import=optional:file:.env[.properties]

spring.application.name=oficiosya

server.port=${SERVER_PORT:8080}

# Behind nginx (TLS terminated at the proxy): trust X-Forwarded-* so the app
# sees the original scheme/host when building URLs and redirects.
server.forward-headers-strategy=framework

# --- Datasource: PostgreSQL (the "db" service in docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:oficiosya}
spring.datasource.username=${DB_USERNAME:oficiosya}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Web: host without scheme, used by SecurityConfig to build the CORS allowed origins
app.web-url=${WEB_URL:localhost}

# Auth
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:private_jwt.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:public_jwt.pem}
